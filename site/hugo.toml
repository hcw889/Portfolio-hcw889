baseURL = "https://hcw889.github.io/Portfolio-hcw889/"
defaultContentLanguage = "ko"
locale = "ko-KR"
title = "Portfolio : 홍채운"


# Pagination
[pagination]
  pagerSize = 10
  path = "page"

# Enable raw HTML for vintage content
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Suppress raw HTML warnings
ignoreLogs = ['warning-goldmark-raw-html']

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Menu
[[menu.main]]
  name = "홈"
  url = "/"
  weight = 10

[[menu.main]]
  name = "소개"
  url = "/about/"
  weight = 20

[[menu.main]]
  name = "활동"
  url = "/posts/"
  weight = 30

# Theme Parameters
[params]
  # Site Description
  description = "인프라 엔지니어를 꿈꾸는 대학생 홍채운의 포트폴리오"
  author = "hcw889"

  # Retro Features
  show_browser_chrome = false
  show_status_bar = true
  show_sidebar = true
  show_welcome_message = true
  welcome_message = "Welcome to my Portfolio! visitor : #3286!"

  # Content Display
  show_featured_sections = false
  show_stats = true
  show_retro_elements = false
  show_sharing = false

  # Footer Options
  show_retro_footer = false
  show_build_info = false

  # Sidebar Options
  show_sidebar_stats = true
  show_retro_sidebar = false
  sidebar_content = ""

  # Social Links
  [params.social]
    instagram = "g.cd.23"
    github = "hcw889"
    email = "hcw889889@gmail.com"
